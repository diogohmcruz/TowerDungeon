spring:
  application:
    name: tower-dungeon
  output:
    ansi:
      enabled: always

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'

server:
  compression:
    enabled: true
  http2:
    enabled: true
  port: 8080

game:
  start:
    credit: 10.0
  loop:
    lifecycle-ms: 1000
    invasion-tick-ms: 10
    supply-drain-per-unit: 1.5
    starvation-damage: 5.0
  reward:
    credit-per-floor: 2.0
    materials-per-floor: 5.0
    supplies-per-floor: 3.0
    relic-depth-threshold: 10
    boss-reward-multiplier: 3.0
    materials-sell-price: 2.0
    relics-sell-price: 25.0
    food-sell-price: 1.0
  tower:
    max-floor: 100
  boss:
    interval: 10
    health-base-multiplier: 3.0
    health-multiplier-per-floor: 0.05
    damage-multiplier: 1.25
  enemies:
    base-budget: 3.0
    budget-per-floor: 0.8
    quadratic-per-floor: 0.04
    variance: 0.25
    surge-interval: 5
    surge-multiplier: 1.5
    ease-budget-per-boss: 0.15
    ease-difficulty-per-boss: 1
    gentle-floors: 9
    gentle-start-multiplier: 0.45
    step-budget-per-boss: 0.15
    min-budget: 1.0
    # Body parts each enemy type is born with (inclusive). Torso always, head from 2 parts up, the
    # rest random limbs; a guardian always has all six. Health is divided by game.body.weights.
    parts:
      slime: {min: 1, max: 1}
      chymus-insect: {min: 1, max: 1}
      dead-soldiers: {min: 2, max: 6}
      tower-beast: {min: 3, max: 6}
      chimera: {min: 4, max: 6}
      necromancer: {min: 6, max: 6}
      stone-golem: {min: 6, max: 6}
      dead-dragon: {min: 6, max: 6}
      dragon: {min: 6, max: 6}
  supply:
    base-max: 100.0
  recruit:
    strength-spread: 0.30
  body:
    weights:
      torso: 0.50
      head: 0.10
      arm: 0.08
      leg: 0.12
  sanity:
    max: 100.0
    kill-gain: 2.0
    floor-climbed-gain: 5.0
    ally-death-drain: 10.0
    fear-meet-drain: 5.0
    depth-drain-per-floor: 0.01
    recovery-per-tick: 2.0
    recovery-food-per-tick: 0.5
    phobia-count-chances: [0.40, 0.40, 0.20]
    severity-at-full-sanity: 0.25
    phobia-effect: 0.5
  items:
    bundle:
      leftover-chance: 0.20
      find-chance: 0.15
      sanity-gain: 10.0
    weights:
      power: 1.0
      armour: 0.8
      accuracy: 0.6
      evasion: 0.6
      sanity: 0.4
      effect: 2.0
    leftover:
      min-stats: 1
      max-stats: 2
      floor-scaling: 0.05
      roll-min: 0.5
      roll-max: 1.5
      base:
        power: 0.5
        armour: 0.5
        accuracy: 5.0
        evasion: 5.0
        sanity: 5.0
  magic:
    max-mana: 5.0
    cost-per-cast: 1.0
    recharge-per-tick: 0.25
    tower-recharge-per-tick: 0.05
  reinforcements:
    climb-floors-per-tick: 1.0
  healing:
    cost-per-hp: 1.0
    hp-per-tick: 5.0
  village:
    starting-food: 100.0
    starting-villagers: 20
    villager-food-production: 0.5
    unit-food-consumption: 1.0
  trades:
    breaker-materials-per-tick: 0.25
    scribe-knowledge-per-tick: 0.05
    yield-per-highest-floor: 0.02
    starting-posts: 10
    tiller-minimum: 5
    settling-ticks: 10
    emergency-tilling-below: 20.0
    emergency-tilling-above: 60.0
    stockroom-base: 60.0
    stockroom-per-floor: 4.0
    heap-per-floor: 10.0
    heap-delivery-per-floor-cleared: 5.0
  architecture:
    enabled: false
    seed: 362108372306
  prestige:
    points-divisor: 9.0
    ascent-marks-per-floor: 0.4
    guardian-marks: 1.5
    load-mark: 0.05
    load-cap: 8
    door-floor: 99
    counters:
      food-grown: {marks: 3.0, par: 60000.0}
      materials-banked: {marks: 6.0, par: 17000.0}
      credits-banked: {marks: 3.0, par: 6800.0}
      relics-banked: {marks: 4.0, par: 320.0}
      expeditions: {marks: 3.0, par: 17.0}
  persistence:
    # Must be a mounted volume: on an ephemeral filesystem every deploy deletes every Campaign.
    data-dir: ./data
    linger: 30s
  security:
    # Empty allows any Origin. In production list the site, e.g. https://play.example.com
    allowed-origins: []
    # Production behind TLS should set this to true.
    require-wss: false
