<!-- The top bar's own buttons. The first one follows what is on screen: Hide menus while the list view, a popover or the narrow bar shows, Show menus (opens the list) when none does. -->
<button
  type="button"
  class="menus-toggle"
  (click)="menus.toggle()"
  [attr.aria-pressed]="!menus.showing()"
  aria-keyshortcuts="H"
  [attr.aria-label]="menus.showing() ? 'Hide menus (H)' : 'Show menus (H)'"
  [title]="menus.showing() ? 'Hide menus (H)' : 'Show menus (H)'"
>
  {{ menus.showing() ? 'Hide menus' : 'Show menus' }}
</button>
@if (gameState().expeditionActive) {
<button
  type="button"
  class="menus-toggle closeup-toggle"
  (click)="zoom.toggleCloseup()"
  [attr.aria-pressed]="zoom.level() !== 'battle'"
  aria-label="Closeup of the current Floor. Holds the Party and the Village clock. Escape steps back."
  title="Closeup of the current Floor (holds time; Escape steps back)"
>
  {{
    zoom.level() === 'unit'
      ? 'Back to closeup'
      : zoom.closeup()
        ? 'Leave closeup'
        : 'Closeup'
  }}
</button>
}
<!-- A Held Party waits for the player. The same Resume is in the list view. -->
@if (session()?.held && !zoom.holding()) {
<p class="held-party" role="status">
  The Party has not moved.
  <button type="button" class="btn" (click)="launch.resume()">Resume</button>
</p>
}

<!-- Narrow screens have no clear lane for the bell and the lamp, so they are repeated
     here as plain buttons: the same commands, the same refusals. -->
<div class="launch-bar" [class.menus-hidden]="stage.launchBarHidden() || zoom.level() !== 'battle'">
  @if (launch.refusal(); as refusal) {
  <p class="launch-line" role="status">{{ refusal.text }}</p>
  }
  <button type="button" class="btn" (click)="launch.ring()" [attr.aria-disabled]="!launch.bell().usable">
    {{ launch.bell().command === 'wave' ? 'Ring the bell: send a Wave' : 'Ring the bell: set out' }}
  </button>
  <button type="button" class="btn" (click)="launch.light()" [attr.aria-disabled]="!launch.extractControl().usable">
    Light the lamp: extract
  </button>
</div>

<app-tower
  class="tower"
  [tower]="gameState().tower"
  [active]="gameState().expeditionActive"
  [party]="gameState().unitsOnTower"
  [reinforcements]="gameState().reinforcements"
></app-tower>

<!-- The list view: every building's gauges and actions as plain DOM, opened with L. -->
<app-list-view />
