<main class="main">
  <app-settings-panel />
  <button
    type="button"
    class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    {{ theme() === 'dark' ? 'Night' : 'Day' }}
  </button>
  @if (showGate()) {
  <app-gate />
  } @else { @if (notice(); as message) {
  <p class="connection-notice" role="alert">
    {{ message }}
    @if (canRetry()) {
    <button type="button" class="btn" (click)="retry()">Take it back</button>
    }
  </p>
  }
  <div class="content">
    <app-game-component></app-game-component>
  </div>
  }
</main>

<router-outlet />
