<div class="tower-scene-host">
  @if (sceneShown()) {
    <app-tower-scene
      [tower]="tower()"
      [party]="party()"
      [active]="active()"
      [reinforcements]="reinforcements()"
    />
    <app-unit-focus [party]="party()" [tower]="tower()" />
  } @else {
    <app-village-scene />
  }
  <app-transition-veil />
</div>
