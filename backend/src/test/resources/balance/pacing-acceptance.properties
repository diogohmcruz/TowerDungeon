# The bars of the pacing acceptance test (#118). Win rates of each Generation's reference plan
# (balance/pacing-table.json) on the real combat code, measured by the floor duel harness.
#
# Every Floor from the plan's start Floor up to its target must be won at least this often:
normal.min=0.70
guardian.min=0.50
surge.min=0.60
# The first Guardian Floor beyond the target is a wall: the plan wins it at most this often.
wall.max=0.35

# Runs per Floor and the seed. The fast test (default build) samples fewer runs and widens each bar
# by margin (a lower bound drops by it, the wall rises by it) so sampling noise cannot fail it;
# the full sweep (-Dpacing.acceptance=full) runs more and widens by the smaller margin.
fast.runs=100
fast.margin=0.05
full.runs=300
full.margin=0.02
seed=1
