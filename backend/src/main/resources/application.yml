spring:
  application:
    name: tower-dungeon
  output:
    ansi:
      enabled: always
  ai:
    mcp:
      server:
        # The MCP server is off unless the agent or agent-stdio profile turns it on.
        enabled: false
        name: tower-dungeon
        version: 1.0.0
        type: ASYNC
        request-timeout: 30s
        capabilities:
          prompt: false
          completion: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        # Only these three are reachable over HTTP. Never '*': that would add env, beans, heapdump.
        include: health,info,metrics

server:
  shutdown: graceful
  compression:
    enabled: true
  http2:
    enabled: true
  port: 8080

game:
  # Secret the seeds of human Campaigns are drawn from. Unset: a random one is made at each start,
  # which is safe because every Campaign saves its own seed. Never put a seed itself here.
  # seed-secret: ${GAME_SEED_SECRET}
  start:
    credit: 10.0
  loop:
    lifecycle-ms: 1000
    invasion-tick-ms: 10
    supply-drain-per-unit: 1.5
    starvation-damage: 5.0
    # What a Unit eats is multiplied by this by Floor (anchors, read geometrically between them).
    # Floors 1 to 5 stay at 1, as measured; deeper Floors are fought in fewer, heavier ticks.
    supply-drain-curve: {5: 1.0, 10: 0.7, 20: 0.6, 30: 0.5, 50: 0.33, 80: 0.17, 100: 0.13}
  reward:
    credit-per-floor: 2.0
    materials-per-floor: 5.0
    supplies-per-floor: 3.0
    boss-reward-multiplier: 3.0
    materials-sell-price: 2.0
    relics-sell-price: 25.0
    food-sell-price: 1.0
  tower:
    max-floor: 100
  boss:
    interval: 10
    health-base-multiplier: 3.0
    health-multiplier-per-floor: 0.05
    damage-multiplier: 1.25
    # A Guardian's total health by Floor (before Tower Memory), replacing the archetype's health
    # times (health-base-multiplier + health-multiplier-per-floor x Floor). The archetype keeps its
    # weaknesses, damage and Body Parts. Sized with the floor duel harness, see
    # docs/research/curve-floors-6-to-100.md.
    health-curve: {10: 575.0, 20: 825.0, 30: 1225.0, 40: 970.0, 50: 590.0, 60: 1455.0, 70: 7025.0,
                   80: 2150.0, 90: 2140.0, 100: 2100.0}
  enemies:
    base-budget: 3.0
    budget-per-floor: 0.8
    quadratic-per-floor: 0.04
    variance: 0.25
    surge-interval: 5
    surge-multiplier: 1.5
    ease-budget-per-boss: 0.25
    ease-budget-floor: 0.5
    ease-budget-cap: 0.6
    ease-difficulty-per-boss: 1
    gentle-floors: 9
    gentle-start-multiplier: 0.45
    step-budget-per-boss: 0.15
    min-budget: 1.0
    # Floors 6 to 100 (curve-from-floor on): the garrison budget, the tier window and the surge
    # come from these anchors, read geometrically between them, instead of the formula above,
    # which still sets Floors 1 to 5 as measured. See docs/research/curve-floors-6-to-100.md.
    curve-from-floor: 6
    budget-curve: {5: 6.5, 10: 9.2, 20: 17.8, 30: 24.8, 40: 30.0, 50: 38.0, 59: 45.1, 60: 46.0,
                   70: 52.0, 80: 58.0, 90: 60.0, 100: 65.0}
    tier-min-curve: {6: 0.0, 30: 0.0, 40: 1.0, 50: 2.0, 60: 3.0, 100: 3.0}
    tier-max-curve: {6: 1.5, 20: 2.8, 30: 3.7, 40: 4.6, 50: 5.0, 100: 5.0}
    surge-multiplier-upper: 1.15
    # Body parts each enemy type is born with (inclusive). Torso always, head from 2 parts up, the
    # rest random limbs; a guardian always has all six. Health is divided by game.body.weights.
    parts:
      slime: {min: 1, max: 1}
      chymus-insect: {min: 1, max: 1}
      dead-soldiers: {min: 2, max: 6}
      tower-beast: {min: 3, max: 6}
      chimera: {min: 4, max: 6}
      necromancer: {min: 6, max: 6}
      stone-golem: {min: 6, max: 6}
      dead-dragon: {min: 6, max: 6}
      dragon: {min: 6, max: 6}
  supply:
    base-max: 100.0
    # Porters and Supply Lines carry this many times what they did when Floors 6 to 100 were sized.
    carry-multiplier: 3.0
  recruit:
    strength-spread: 0.30
  body:
    weights:
      torso: 0.50
      head: 0.10
      arm: 0.08
      leg: 0.12
  sanity:
    max: 100.0
    kill-gain: 2.0
    floor-climbed-gain: 5.0
    ally-death-drain: 10.0
    fear-meet-drain: 5.0
    depth-drain-per-floor: 0.01
    recovery-per-tick: 2.0
    recovery-food-per-tick: 0.5
    phobia-count-chances: [0.40, 0.40, 0.20]
    severity-at-full-sanity: 0.25
    phobia-effect: 0.5
    accuracy-penalty: 20.0
  items:
    floor-gear-cap: 12
    bundle:
      leftover-chance: 0.20
      find-chance: 0.15
      sanity-gain: 10.0
    affinity:
      chance: 0.5
      rating-multiplier: 1.25
      find-multiplier: 1.5
    weights:
      power: 1.0
      armour: 0.8
      accuracy: 0.6
      evasion: 0.6
      sanity: 0.4
      effect: 2.0
    leftover:
      min-stats: 1
      max-stats: 2
      floor-scaling: 0.05
      roll-min: 0.5
      roll-max: 1.5
      base:
        power: 0.5
        armour: 0.5
        accuracy: 5.0
        evasion: 5.0
        sanity: 5.0
    drop-rates:
      leftover: 0.9
      talisman: 0.1
    surplus-relics:
      leftover: 1
      talisman: 3
    effects:
      steadfast-max-sanity: 10.0
      keen-accuracy: 10.0
      wary-evasion: 10.0
      ember-magic-damage: 1.0
      gloom-taken-reduction: 0.05
      salted-taken-reduction: 0.25
      thorn-damage: 1.0
      lantern-sanity-per-floor: 2.0
      mana-vessel-max-mana: 5.0
      dragon-slayer-multiplier: 2.0
      salt-satchel-attrition-factor: 0.5
    artifacts:
      sargans-mask-floor: 40
      mana-vessel-floor: 30
      dragon-slayer-floor: 60
      salt-satchel-floor: 20
  magic:
    max-mana: 5.0
    cost-per-cast: 1.0
    recharge-per-tick: 0.25
    tower-recharge-per-tick: 0.05
  reinforcements:
    climb-floors-per-tick: 1.0
  healing:
    cost-per-hp: 1.0
    hp-per-tick: 5.0
  village:
    starting-food: 100.0
    starting-villagers: 20
    villager-food-production: 0.5
    unit-food-consumption: 1.0
  trades:
    breaker-materials-per-tick: 0.25
    scribe-knowledge-per-tick: 0.05
    yield-per-highest-floor: 0.02
    starting-posts: 10
    tiller-minimum: 5
    settling-ticks: 10
    emergency-tilling-below: 20.0
    emergency-tilling-above: 60.0
    stockroom-base: 60.0
    stockroom-per-floor: 4.0
    heap-per-floor: 10.0
    heap-delivery-per-floor-cleared: 5.0
    tome-base-cost: 60.0
    tome-cost-growth: 1.5
    tome-bonus-per-level: 0.25
    posts-per-level: 5
    post-base-cost: 25.0
    post-cost-growth: 1.6
  tiers:
    sheltered: {food-grown: 1000.0, highest-floor: 5}
    fortified: {materials-banked: 1000.0, highest-floor: 10, expeditions: 6}
    entrenched: {relics-banked: 60.0, highest-floor: 25}
  wipe:
    risen-cap-max: 3
    risen-cap-fraction: 0.30
  year:
    ticks-per-quarter: 150
    spring-sanity-drain: 0.80
    summer-supplies-drain: 0.95
    autumn-fields-yield: 1.20
    winter-attrition: 1.10
    sea-risk-mean: 0.105
    sea-risk-amplitude: 0.095
    sea-risk-phase-ticks: 75
    sea-risk-refresh-ticks: 10
  salt:
    per-salter-per-tick: 0.15
    supplies-per-salt: 10.0
    salted-drain-per-unit: 1.25
    sell-price: 2.0
    pack-capacity: 10.0
    pack-enemy: CHYMUS_INSECT
    pack-damage-bonus: 0.5
    bearer-target-bias: 0.75
  trust:
    ring-max-level: 5
    ring-base-cost: 10.0
    ring-cost-growth: 1.5
    wave-speed-per-level: 0.25
    wave-capacity-per-level: 5.0
    survivors-notes-capacity-per-level: 10.0
  spores:
    per-sporewarden-per-tick: 0.05
    dose-heal: 20.0
    reattach-share: 0.25
    panacea-spores: 4
    panacea-materials: 40.0
    panacea-capacity: 10.0
    panacea-save-share: 0.10
    loot-from-floor: 20
    loot-per-floor: 1.0
    guardian-loot-multiplier: 3.0
  port:
    # Placeholders: the footing opens at this many completed Expeditions; finishing it costs these
    # from the Vault.
    footing-expeditions: 12
    materials-cost: 600.0
    credits-cost: 300.0
  boat:
    # Placeholder: lifecycle ticks from the Port being finished to the Boat docking.
    dock-ticks: 600
  voyage:
    # Placeholders for the scaling pass: a Voyage takes one Quarter of connected ticks; cargo goes
    # in lots of Relics, each lot returning Salt or Spores; the chance the sea takes the cargo is
    # the Year's sea risk scaled by Relics sent over the reference, capped.
    ticks: 150
    relics-per-lot: 5
    salt-per-lot: 10
    spores-per-lot: 3
    max-relics: 50
    risk-reference-relics: 10
    risk-cap: 0.20
  architecture:
    enabled: false
    seed: 362108372306
  prestige:
    points-divisor: 9.0
    ascent-marks-per-floor: 2.0
    guardian-marks: 1.5
    load-mark: 0.05
    load-cap: 8
    door-floor: 99
    log-toll: true
    min-points-to-exodus: 3
    defeat-pity: {points: 1, min-qualifying-expeditions: 3}
    defeat-start: {villagers-lost: 5, writ-credits: 100.0}
    chronicle-names: 5
    chronicle-limit: 50
    roll:
      # Legacy already spent in the Courses below that opens Courses I to IV.
      gates: [0, 5, 12, 21]
      costs:
        SEED_GRAIN: 1
        MUSTER_ROLL: 1
        HARDY_STOCK: 2
        WHETSTONE_HABIT: 2
        THE_DOWRY: 3
        HEAVIER_PACKS: 3
        VILLAGE_CHARTER: 3
        THE_HEIR: 3
        BLOOD_OF_THE_DOOR: 6
        NARROW_STAIR: 5
        OVERREACH: 4
        QUARTERMASTERS_TALLY: 3
        HARD_WON_HABITS: 8
        THE_OPEN_BREACH: 6
        READER_OF_OMENS: 4
        OFFERING_STONE: 5
        SECOND_PACT: 5
      seed-grain: {food: 150.0, credits: 20.0}
      hardy-stock: {villagers: 25}
      whetstone-habit: {damage-bonus: 0.05}
      dowry: {credits: 80.0, materials: 40.0, relics: 3.0}
      heavier-packs: {capacity: 25.0}
      village-charter: {tier: 2}
      heir: {health-multiplier: 1.5}
      # Placeholders: survivable on paper, to be replaced by the measured figures.
      narrow-stair: {floor: 21, max-party: 12}
      overreach: {supply-drain-multiplier: 1.3, starvation-damage-multiplier: 2.0, loot-multiplier: 1.5}
      quartermasters-tally: {slots: 3}
      # Relics still in the Vault at the end of a Campaign: 300 is +1 Legacy, at most +3 a
      # Generation. Relics now come only from surplus items, so this is likely too high (#8 refit).
      offering-stone: {relics-per-legacy: 300.0, max-legacy: 3}
    # Free, earned when the Lifetime Ledger crosses a threshold, kept for good.
    epitaphs:
      first-footing: {lifetime-highest-floor: 10}
      names-on-the-wall: {lifetime-units-lost: 100, health-bonus: 0.05}
      ten-seals-broken: {lifetime-guardians-slain: 15, easing-multiplier: 1.25}
    counters:
      food-grown: {marks: 3.0, par: 60000.0}
      materials-banked: {marks: 6.0, par: 17000.0}
      credits-banked: {marks: 3.0, par: 6800.0}
      relics-banked: {marks: 4.0, par: 320.0}
      expeditions: {marks: 22.0, par: 17.0}
  persistence:
    # Must be a mounted volume: on an ephemeral filesystem every deploy deletes every Campaign.
    data-dir: ./data
    linger: 30s
    # How long ending a Campaign or beginning a Generation waits for its write before failing.
    end-write-wait: 10s
    # Seals the spoiler-sensitive part of exported files. Must be stable across deploys; the app
    # refuses to start in the prod profile without it (set GAME_PERSISTENCE_SEAL_KEY).
    seal-key: ${GAME_PERSISTENCE_SEAL_KEY:}
  security:
    # Empty allows any Origin. In production list the site, e.g. https://play.example.com
    allowed-origins: []
    # Production behind TLS should set this to true.
    require-wss: false
  agent:
    # The whole agent surface (tools, resources, filter) exists only when this is true, which the
    # agent and agent-stdio profiles set.
    enabled: false
    http:
      endpoint: /mcp
      # SHA-256 of the developer bearer token, as hex; never the token itself:
      #   printf '%s' "$TD_AGENT_DEV_TOKEN" | shasum -a 256
      dev-token-hash: ${TD_AGENT_DEV_TOKEN_HASH:}
      # The human Campaign (a player id) the developer token may read; empty for none.
      dev-campaign: ""
      allowed-origins: []
      allowed-hosts: [localhost, 127.0.0.1, "[::1]"]
      max-body-bytes: 65536
    sandbox:
      # Never true on a public server: a Sandbox Campaign runs headless, as fast as the CPU allows.
      enabled: false
      max-per-grant: 8
      max-global: 64
      call-wall-time: 2s
      # 6 hours of simulated time per Campaign, and at most 3600 ticks per wait.
      max-simulated-seconds: 21600
      max-ticks-per-wait: 3600
  trial:
    # No Trial runs longer than this, whatever its Terms say.
    max-limit: 90m
    races:
      # The first Terms: the Short preset. Floor 20 waits for a measured baseline (#65); raising the
      # Finish Floor is a change here and needs no code. The seed is derived from game.seed-secret
      # and the race id (never write one here); the balance hash is pinned to the running balance
      # at start-up unless config-hash states one, and a server whose balance differs refuses entry.
      - race-id: season-1
        kind: SEASON
        plan-version: 1
        finish-floor: 10
        limit: 90m
        max-attempts: 3
        max-concurrent: 20
        # opens-at / closes-at: ISO instants. Blank is open and never closes: set both before launch.
