# The agent-stdio profile: the MCP server speaks JSON-RPC over stdin and stdout, so nothing else may
# touch stdout. No web server, no banner, no colour codes, and every log line goes to stderr (see
# logback-spring.xml). Local and private runs only.
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  output:
    ansi:
      enabled: never
  ai:
    mcp:
      server:
        enabled: true
        stdio: true
        type: ASYNC
        capabilities:
          # The playtest and balance prompts (design 4.9).
          prompt: true

game:
  agent:
    enabled: true
    sandbox:
      enabled: true
  persistence:
    # The agent runs beside a developer's own game: keep its Campaigns apart.
    data-dir: ./data-agent
